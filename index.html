    <title>Password Generator | Professional Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --card: #ffffff; }
        body { margin: 0; background: var(--bg); font-family: 'Inter', sans-serif; color: #0f172a; padding: 20px; }
        .wrapper { width: 90%; max-width: 800px; margin: 0 auto; }
        
        .ad-container { margin: 20px auto; border-radius: 16px; overflow: hidden; display: flex; justify-content: center; background: #f1f5f9; align-items: center; border: 1px solid #e2e8f0; width: 100%; min-height: 90px; }

        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 2.5rem; color: #6366f1; font-weight: 800; }
        
        textarea { width: 100%; height: 80px; border: 2px solid #e2e8f0; border-radius: 16px; padding: 20px; font-size: 24px; font-weight: 700; text-align: center; resize: none; margin-bottom: 20px; box-sizing: border-box; }

        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin: 25px 0; font-size: 1rem; }
        
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button.secondary { background: #475569; margin-top: 15px; }
        button:hover { filter: brightness(1.1); }
        input[type=range] { width: 100%; margin: 15px 0; }

<body>
    <div class="wrapper">
        <header>
            <h1>Password Generator</h1>
        </header>

        <div class="ad-container">
            <script type="text/javascript">
                atOptions = {'key' : 'ea9023c6230a4134ea2bb21d415f3647', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {}};
            </script>
            <script type="text/javascript" async src="https://www.highperformanceformat.com/ea9023c6230a4134ea2bb21d415f3647/invoke.js"></script>
        </div>

        <textarea id="passOutput" readonly placeholder="Your password..."></textarea>

        <div class="card">
            <label style="font-weight:600;">Length: <b id="lenVal" style="color:var(--primary);">16</b></label>
            <input type="range" id="length" min="4" max="50" value="16" oninput="document.getElementById('lenVal').innerText = this.value">
            
            <div class="controls">
                <label><input type="checkbox" id="upper" checked> Uppercase</label>
                <label><input type="checkbox" id="lower" checked> Lowercase</label>
                <label><input type="checkbox" id="nums" checked> Numbers</label>
                <label><input type="checkbox" id="syms"> Symbols</label>
            </div>
            
            <button onclick="generatePassword()">Generate</button>
            <button class="secondary" id="copyBtn" onclick="copyText()">Copy</button>
        </div>

        <div class="ad-container" style="min-height: 250px;">
            <script type="text/javascript">
                atOptions = {'key' : '7cf39fb102b8e5ac06d9ab8ec745e58c', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {}};
            </script>
            <script type="text/javascript" async src="https://www.highperformanceformat.com/7cf39fb102b8e5ac06d9ab8ec745e58c/invoke.js"></script>
        </div>
    </div>

    <script>
        function generatePassword() {
            const length = document.getElementById('length').value;
            const hasUpper = document.getElementById('upper').checked;
            const hasLower = document.getElementById('lower').checked;
            const hasNums = document.getElementById('nums').checked;
            const hasSyms = document.getElementById('syms').checked;
            const output = document.getElementById('passOutput');
            let chars = "";
            if (hasUpper) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (hasLower) chars += "abcdefghijklmnopqrstuvwxyz";
            if (hasNums) chars += "0123456789";
            if (hasSyms) chars += "!@#$%^&*()_+~`|}{[]:;?><,./-=";
            if (chars === "") { alert("Select at least one!"); return; }
            let password = "";
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            output.value = password;
        }
        function copyText() {
            const output = document.getElementById('passOutput');
            const btn = document.getElementById('copyBtn');
            if(!output.value) return;
            output.select();
            document.execCommand('copy');
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy", 1000);
        }
    </script>
